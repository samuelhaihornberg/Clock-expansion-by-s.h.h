<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061018">
  <link rel="stylesheet" href="styles.css">
  <title>Clock Expansion — UTC</title>
</head>
<body class="clock-body">
  <main class="clock-screen">
    <div class="clock-controls" aria-label="Commandes de l’horloge">
      <a class="back-button" href="index.html" aria-label="Retour au choix des horloges">←</a>
      <div class="control-group">
        <button id="display-mode-button" class="mode-button" type="button" aria-pressed="false">Calendrier</button>
        <button id="fullscreen-button" class="fullscreen-button" type="button" aria-label="Afficher l’horloge en plein écran" aria-pressed="false">⛶</button>
      </div>
    </div>
    <header class="time-banner" aria-live="polite">
      <div id="name" class="banner-zone">UTC</div>
      <div id="country" class="banner-zone">Monde</div>
      <div id="time" class="banner-time">00:00:00.000</div>
      <div id="date" class="banner-date">—</div>
      <div id="display-mode-label" class="banner-mode">Horloge</div>
    </header>
    <section class="stage" aria-label="Horloge concentrique plein écran">
      <canvas id="clock" aria-label="Horloge visuelle"></canvas>
      <div class="center" aria-hidden="true"><span class="center-mark"></span></div>
    </section>
  </main>
  <script src="clock.js"></script>
  <script>
    (() => {
      const fullscreenButton = document.querySelector('#fullscreen-button');
      const modeButton = document.querySelector('#display-mode-button');
      const screen = document.querySelector('.clock-screen');
      const modeLabel = document.querySelector('#display-mode-label');
      fullscreenButton?.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await screen.requestFullscreen();
        } catch (_) { fullscreenButton.setAttribute('aria-label', 'Plein écran indisponible sur cet appareil'); }
      });
      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        fullscreenButton?.setAttribute('aria-pressed', String(active));
        if (fullscreenButton) fullscreenButton.textContent = active ? '×' : '⛶';
      });
      modeButton?.addEventListener('click', () => {
        const calendar = document.body.classList.toggle('calendar-mode');
        modeButton.textContent = calendar ? 'Horloge' : 'Calendrier';
        modeButton.setAttribute('aria-pressed', String(calendar));
        if (modeLabel) modeLabel.textContent = calendar ? 'Calendrier' : 'Horloge';
        window.dispatchEvent(new CustomEvent('clock-display-mode', { detail: { calendar } }));
      });
    })();
  </script>
</body>
</html>
